<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Broker Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --surface-2:#E3E9E6; --ink:#12302F; --ink-2:#4E6664; --line:#D3DCD8;
  --sea:#1F6F66; --sea-soft:#D6EAE6; --brass:#9A6B14; --brass-soft:#F3E7CC; --coral:#B8472F; --coral-soft:#F6DDD6;
  --plum:#5B4A8A; --plum-soft:#E6E1F3;
  --radius-lg:22px; --radius:14px; --radius-sm:9px;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Instrument Sans", "Helvetica Neue", "Segoe UI", system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1A1A; --surface:#162625; --surface-2:#1E3231; --ink:#E4EEEB; --ink-2:#97ABA8; --line:#2A403E;
    --sea:#5FB8AC; --sea-soft:#1D3A37; --brass:#D9AE5B; --brass-soft:#3A3020; --coral:#E78468; --coral-soft:#3D2520;
    --plum:#A99AD8; --plum-soft:#2D2840; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A1A; --surface:#162625; --surface-2:#1E3231; --ink:#E4EEEB; --ink-2:#97ABA8; --line:#2A403E;
  --sea:#5FB8AC; --sea-soft:#1D3A37; --brass:#D9AE5B; --brass-soft:#3A3020; --coral:#E78468; --coral-soft:#3D2520;
  --plum:#A99AD8; --plum-soft:#2D2840; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative}
header.top{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 6px}
.brand{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;border-radius:3px;background:var(--sea);display:inline-block;transform:rotate(45deg)}
.iconbtn{width:40px;height:40px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--ink-2)}
.iconbtn:hover{background:var(--surface-2)}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 16px 110px;-webkit-overflow-scrolling:touch}
h1{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.05;letter-spacing:-.025em;margin:6px 4px 8px}
.lede{margin:0 4px 20px;color:var(--ink-2);font-size:15.5px;max-width:34em}
.lede b{color:var(--ink);font-weight:600}
h2{font-family:var(--display);font-weight:500;font-size:19px;letter-spacing:-.01em;margin:26px 4px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
h2 small{font-family:var(--body);font-size:13px;color:var(--ink-2);font-weight:500}
h2.late{color:var(--coral)}
.list{background:var(--surface);border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{font-size:13.5px;color:var(--ink-2);text-align:right;flex-shrink:0}
.row .r.late{color:var(--coral);font-weight:600}
.row.done .t{text-decoration:line-through;color:var(--ink-2)}
.tap{cursor:pointer}
.tap:active{background:var(--surface-2)}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:var(--surface);flex-shrink:0;display:grid;place-items:center;padding:0;color:transparent}
.check:hover{border-color:var(--sea)}
.check.on{background:var(--sea);border-color:var(--sea);color:#fff}
.kind{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex-shrink:0;background:var(--surface-2);color:var(--ink-2)}
.kind.Call{background:var(--sea-soft);color:var(--sea)}
.kind.Meeting,.kind.Viewing{background:var(--plum-soft);color:var(--plum)}
.kind.Follow-up{background:var(--brass-soft);color:var(--brass)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--sea-soft);color:var(--sea);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:14px;flex-shrink:0}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.pill.Hot{background:var(--coral-soft);color:var(--coral)}
.pill.Warm{background:var(--brass-soft);color:var(--brass)}
.pill.Client{background:var(--sea-soft);color:var(--sea)}
.pill.New{background:var(--plum-soft);color:var(--plum)}
.pill.stage-received{background:var(--sea-soft);color:var(--sea)}
.pill.stage-closed{background:var(--brass-soft);color:var(--brass)}
.pill.stage-lost{background:var(--coral-soft);color:var(--coral)}
.empty{padding:22px 18px;color:var(--ink-2);font-size:14.5px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius-lg)}
.empty button{margin-top:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;margin:0 -16px;padding-left:18px;padding-right:18px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-size:14px;font-weight:500;white-space:nowrap;color:var(--ink-2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip span{opacity:.6;margin-left:4px}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:12px 14px;margin:0 0 12px;font-size:16px}
.btn{border:0;border-radius:99px;padding:11px 18px;font-weight:600;font-size:15px;background:var(--sea);color:#fff;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.small{padding:7px 13px;font-size:13.5px}
.btn.danger{background:transparent;color:var(--coral);padding-left:0}
.btn.block{width:100%}
.deal{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:15px 16px;margin-bottom:10px}
.deal .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.deal .name{font-weight:600;font-size:16px}
.deal .who{font-size:13.5px;color:var(--ink-2)}
.deal .nums{display:flex;gap:18px;margin:12px 0 10px;font-size:13px;color:var(--ink-2)}
.deal .nums b{display:block;font-family:var(--display);font-weight:500;font-size:18px;color:var(--ink);letter-spacing:-.01em}
.deal .nums b.comm{color:var(--brass)}
.deal .foot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.stagebar{display:flex;gap:4px;margin-top:2px}
.stagebar i{height:4px;flex:1;border-radius:4px;background:var(--surface-2)}
.stagebar i.on{background:var(--sea)}
/* earnings */
.ledger{background:var(--ink);color:var(--bg);border-radius:var(--radius-lg);padding:20px 20px 18px;margin:4px 0 8px}
.ledger .lbl{font-size:14px;opacity:.75}
.ledger .big{font-family:var(--display);font-weight:700;font-size:44px;letter-spacing:-.03em;line-height:1.05;margin:2px 0 14px}
.ledger .big small{font-size:18px;font-weight:500;opacity:.7;margin-right:4px}
.split{display:flex;height:10px;border-radius:10px;overflow:hidden;background:rgba(255,255,255,.12);margin-bottom:12px}
.split i{display:block;height:100%}
.legend{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;font-size:12.5px}
.legend div{opacity:.9}
.legend b{display:block;font-family:var(--display);font-weight:500;font-size:16px;margin-top:2px}
.legend .dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}
.yearsel{display:flex;gap:6px;margin-bottom:10px}
.yearsel button{background:transparent;border:1px solid rgba(255,255,255,.25);color:inherit;border-radius:99px;padding:4px 11px;font-size:13px}
.yearsel button.on{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.amt{font-family:var(--display);font-weight:500;font-size:16px;color:var(--brass);white-space:nowrap}
/* nav */
nav.bottom{position:absolute;left:0;right:0;bottom:0;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));margin-bottom:calc(-1 * env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(var(--tabs,7),1fr);align-items:center}
nav.bottom button.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:500;color:var(--ink-2);padding:4px 0}
nav.bottom button.tab.on{color:var(--sea)}
.fab{position:absolute;right:16px;bottom:calc(100% + 14px);width:56px;height:56px;border-radius:18px;border:0;background:var(--sea);color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px color-mix(in srgb,var(--sea) 40%,transparent)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(8,20,20,.45);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--surface);border-radius:24px 24px 0 0;max-height:92%;overflow-y:auto;transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);z-index:21;padding:8px 20px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet.on{transform:none}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:4px auto 10px}
.sheet h3{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:-.02em;margin:4px 0 14px}
.field{margin-bottom:13px}
.field label{display:block;font-size:13.5px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:var(--radius-sm);padding:11px 12px;font-size:16px}
.field textarea{min-height:76px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:13px;color:var(--ink-2);margin:-4px 0 14px}
.hint b{color:var(--brass)}
.actions{display:flex;gap:10px;align-items:center;margin-top:8px}
.actions .btn:not(.danger){flex:1}
.segs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.segs button{border:1px solid var(--line);background:var(--bg);border-radius:var(--radius-sm);padding:8px 2px;font-size:12.5px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-2)}
.segs button.on{border-color:var(--sea);background:var(--sea-soft);color:var(--sea)}
.quick{display:grid;gap:10px}
.quick button{display:flex;align-items:center;gap:14px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:var(--radius);padding:14px}
.quick b{display:block;font-size:16px}
.quick span{font-size:13.5px;color:var(--ink-2)}
.contact{display:flex;gap:8px;margin:0 0 16px}
.contact a{flex:1;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:4px;padding:11px 4px;border-radius:var(--radius);background:var(--sea-soft);color:var(--sea);font-size:13px;font-weight:600}
.contact a.off{opacity:.4;pointer-events:none}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px;margin:0 0 6px}
.facts dt{color:var(--ink-2)}
.facts dd{margin:0}
.note{background:var(--bg);border-radius:var(--radius-sm);padding:10px 12px;font-size:14.5px;white-space:pre-wrap;margin:6px 0 4px}
.sub{font-family:var(--display);font-weight:500;font-size:17px;margin:20px 0 8px;display:flex;justify-content:space-between;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(158px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 14px 11px 18px;border-radius:99px;font-size:14.5px;display:flex;gap:12px;align-items:center;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:calc(100% - 32px);white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:var(--bg);color:var(--ink);border:0;border-radius:99px;padding:5px 12px;font-weight:600;font-size:13.5px}
.backup-nudge{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--brass-soft);border-radius:var(--radius);padding:12px 14px;margin:0 0 6px}
.backup-nudge b{display:block;font-size:14.5px}
.backup-nudge span{font-size:13px;color:var(--ink-2)}
.calc-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:6px 16px 10px;margin-bottom:12px}
.calc-card h4{font-family:var(--display);font-weight:500;font-size:16px;margin:12px 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.calc-card h4 small{font-family:var(--body);font-size:12.5px;color:var(--ink-2);font-weight:500}
.cin{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line)}
.cin:first-of-type{border-top:0}
.cin label{font-size:14.5px;flex:1}
.cin label small{display:block;font-size:12.5px;color:var(--ink-2)}
.cin .inp{display:flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-sm);padding:0 10px;width:48%;max-width:190px}
.cin .inp:focus-within{border-color:var(--sea)}
.cin .inp span{font-size:13px;color:var(--ink-2)}
.cin input{border:0;background:transparent;width:100%;padding:10px 4px;text-align:right;font-size:16px;font-variant-numeric:tabular-nums;outline:none}
.cin .val{font-variant-numeric:tabular-nums;font-weight:500}
.results{background:var(--ink);color:var(--bg);border-radius:var(--radius-lg);padding:18px 18px 16px;margin-bottom:12px}
.results .hl{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px}
.results .hl div{font-size:13px;opacity:.8}
.results .hl b{display:block;font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:-.02em;opacity:1;line-height:1.15}
.results .hl b.neg{color:#F2A08A}
.results .cur{display:flex;gap:6px;margin-bottom:14px}
.results .cur button{background:transparent;border:1px solid rgba(255,255,255,.25);color:inherit;border-radius:99px;padding:4px 12px;font-size:13px}
.results .cur button.on{background:var(--bg);color:var(--ink);border-color:var(--bg)}
.brk{font-size:14.5px}
.brk .ln{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid var(--line)}
.brk .ln:first-of-type{border-top:0}
.brk .ln span:last-child{font-variant-numeric:tabular-nums;font-weight:500;text-align:right}
.brk .ln.tot span{font-weight:700}
.brk .ln .alt{display:block;font-size:12px;color:var(--ink-2);font-weight:400}
.calc-actions{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 8px}
.calc-actions .btn{flex:1;min-width:130px}
.mini{position:sticky;top:-4px;z-index:2;display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px;background:var(--ink);color:var(--bg);border-radius:var(--radius);padding:10px 14px;margin:0 0 12px;font-size:11.5px;box-shadow:0 -10px 0 var(--bg),0 6px 16px color-mix(in srgb,var(--bg) 70%,transparent)}
.mini div{opacity:.85}
.mini b{display:block;font-family:var(--display);font-weight:700;font-size:17px;opacity:1}
.mini b.neg{color:#F2A08A}
@media (min-width:1000px){ .mini{display:none} }
body.on-calc nav.bottom .fab{display:none}
@media (min-width:760px){ body.on-calc nav.bottom .fab{display:grid} }
@media (min-width:1180px){ body.on-calc nav.bottom .fab{display:flex} }
.prow{padding:10px 0;border-top:1px solid var(--line)}
.prow:first-of-type{border-top:0}
.plabel{font-size:14.5px;font-weight:600;margin-bottom:6px}
.plabel small{font-weight:400;color:var(--ink-2);margin-left:6px;font-size:12.5px}
.plabel-in{width:100%;border:0;border-bottom:1px dashed var(--line);background:transparent;font-size:14.5px;font-weight:600;padding:2px 0 5px;margin-bottom:6px}
.plabel-in:focus{outline:none;border-bottom-color:var(--sea)}
.pgrid{display:grid;grid-template-columns:66px minmax(128px,1.4fr) minmax(0,1fr) 28px;gap:6px;align-items:center}
.pgrid input[type=month]{font-size:14px;padding:9px 0}
.prow{padding:8px 0}
@media (min-width:760px){ .prow:not(.fixed){display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.4fr);gap:10px;align-items:center} .prow:not(.fixed) .plabel-in{margin:0} .pgrid{grid-template-columns:76px minmax(150px,1.3fr) minmax(0,1fr) 32px} }
.pgrid .inp{display:flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-sm);padding:0 8px;min-width:0}
.pgrid .inp:focus-within{border-color:var(--sea)}
.pgrid .inp span{font-size:13px;color:var(--ink-2)}
.pgrid input{border:0;background:transparent;width:100%;min-width:0;padding:9px 2px;font-size:15px;outline:none;font-variant-numeric:tabular-nums}
.pgrid input[data-type=num]{text-align:right}
.pamt{white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:14px;line-height:1.2}
.pamt .tag,.tag{display:block;font-size:10.5px;font-weight:600;color:var(--ink-2)}
.tag.ok{color:#2E7D4F}
.pgrid .rm{width:28px;height:28px}
.waive{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14.5px;font-weight:500}
.waive small{color:var(--ink-2);font-weight:400;font-size:12.5px}
.waive input{width:18px;height:18px;accent-color:var(--sea)}
.okc{color:#2E7D4F;font-weight:600}
.bad{color:var(--coral);font-weight:600}
.results .hl span.subp,.results .subp{display:block;font-size:12px;opacity:.75;margin-top:2px}
.results.pp .hl b{font-size:22px}
.results .split{display:flex;height:10px;border-radius:10px;overflow:hidden;background:rgba(255,255,255,.12)}
.results .split i{display:block;height:100%}
.yr{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:6px 0;font-size:14px}
.yr span{font-weight:600}
.ybar{height:8px;background:var(--surface-2);border-radius:8px;overflow:hidden}
.ybar i{display:block;height:100%;background:var(--sea);border-radius:8px}
.yr b{font-variant-numeric:tabular-nums;font-weight:600}
.yrnote{font-size:12px;color:var(--ink-2);margin:-4px 0 4px 54px}
.pgridcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.pcard{display:flex;flex-direction:column;text-align:left;padding:0;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-lg);overflow:hidden}
.pcard .pimg{aspect-ratio:16/9;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2)}
.pcard .pimg img{width:100%;height:100%;object-fit:cover;display:block}
.pcard .pbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:2px}
.pcard b{font-family:var(--display);font-weight:700;font-size:17px}
.pcard span{font-size:13.5px;color:var(--ink-2)}
.pcard .pmeta{color:var(--brass);font-weight:600}
.prjtop{display:flex;justify-content:space-between;align-items:center;margin:0 2px}
.xhead{display:flex;gap:6px;font-size:12px;color:var(--ink-2);font-weight:600;margin:6px 0 4px}

<body>
<div class="app">
  <header class="top">
    <div class="brand"><i></i>Broker Desk</div>
    <button class="iconbtn" data-act="settings" aria-label="Import, export and settings">

<div class="toast" id="toast"></div>

<script>
/* ---------- icons ---------- */
const I = {
  today:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="12" cy="15" r="1.6" fill="currentColor"/></svg>',

  deals:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 21V10l5-4 5 4v11"/><path d="M13 21V7.5l4-3 4 3V21M2 21h20M6.5 14h3M6.5 17.5h3"/></svg>',

  market:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 20.5h17"/><path d="M4 16l5-5 4 3 7-8"/><path d="M15 6h5v5"/></svg>',
  money:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><ellipse cx="12" cy="6.5" rx="7.5" ry="3"/><path d="M4.5 6.5v5c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-5M4.5 11.5v5c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-5"/></svg>',
  plus:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  check:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  Call:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 3.5h3.5l1.8 4.6-2.4 1.5a11 11 0 0 0 6.5 6.5l1.5-2.4 4.6 1.8V19a2 2 0 0 1-2 2A16.5 16.5 0 0 1 3 5.5a2 2 0 0 1 2-2z"/></svg>',
  Meeting:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="8" cy="9" r="3"/><circle cx="16.5" cy="9" r="3"/><path d="M2.5 19c.6-3 2.8-4.5 5.5-4.5s4.9 1.5 5.5 4.5M13.5 15c.9-.4 1.9-.5 3-.5 2.7 0 4.9 1.5 5.5 4.5"/></svg>',
  Viewing:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 11l9-7 9 7M5.5 9.5V20h13V9.5"/><circle cx="12" cy="14" r="2.2"/></svg>',
  'Follow-up':'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4.5V9h-4.5"/></svg>',
  Task:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1" fill="currentColor"/><circle cx="4.5" cy="12" r="1" fill="currentColor"/><circle cx="4.5" cy="18" r="1" fill="currentColor"/></svg>',
  wa:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M4 20l1.3-4A8 8 0 1 1 8.2 19z"/><path d="M9 9.5c.3 2.3 2.2 4.3 4.6 4.8l1-1.2 1.9.8" stroke-linecap="round"/></svg>',
  mail:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="M3.5 7l8.5 6 8.5-6"/></svg>',
  close:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};

/* ---------- constants ---------- */
const TASK_TYPES = ['Call','Meeting','Viewing','Follow-up','Task'];
const CLIENT_STATUS = ['New','Warm','Hot','Client','Cold'];
const STATUS_LABEL = {New:'New lead',Warm:'Warm',Hot:'Hot',Client:'Client',Cold:'Cold'};
const SOURCES = ['Referral','Property Finder','Bayut','Dubizzle','Social media','Walk-in','Cold call','Developer event','Other'];
const STAGES = [
  {id:'negotiating',label:'Negotiating'},
  {id:'reserved',label:'Reserved / EOI'},
  {id:'spa',label:'SPA signed'},
  {id:'closed',label:'Closed – awaiting commission'},
  {id:'received',label:'Commission received'}
];
const STAGE_IDX = Object.fromEntries(STAGES.map((s,i)=>[s.id,i]));
const stageLabel = id => id==='lost' ? 'Lost' : (STAGES.find(s=>s.id===id)||{}).label || id;
const KINDS = ['clients','tasks','deals','calcs','projects','maps'];
const LS_KEY = 'broker-desk-v1';

/* ---------- state ---------- */
const state = {clients:{},tasks:{},deals:{},calcs:{},projects:{},maps:{}};
let unsynced = []; // [kind,id,deleted]
let ui = {tab:'today', clientFilter:'all', clientQuery:'', dealFilter:'open', showLater:false, year:new Date().getFullYear()};
let dbRoot = null, syncMode = 'local', downloads = null;
// Phone app = the same file served from GitHub Pages (no claude.ai runtime around it)
const IS_PHONE = !(window.claude && typeof window.claude.use === 'function');
const SYNC_KINDS = ['clients','tasks','deals','calcs'];
let tomb = {}, lastSync = null;
try{ const t = JSON.parse(localStorage.getItem(LS_KEY+'-tomb')||'null'); if(t){ tomb = t.tomb||{}; lastSync = t.lastSync||null; } }catch(e){}
function saveTomb(){
  const cut = Date.now() - 180*86400000; SYNC_KINDS.forEach(k=>{ Object.entries(tomb[k]||{}).forEach(([id,ts])=>{ if(ts<cut) delete tomb[k][id]; }); });
  try{ localStorage.setItem(LS_KEY+'-tomb', JSON.stringify({tomb, lastSync})); }catch(e){}
  if(typeof saveMeta==='function' && dbRoot) saveMeta();
}

function loadLocal(){
  try{
    const j = JSON.parse(localStorage.getItem(LS_KEY)||'null');
    if(j){ KINDS.forEach(k=>state[k]=j.state?.[k]||{}); unsynced = j.unsynced||[]; }
    const cd = JSON.parse(localStorage.getItem(LS_KEY+'-calc')||'null'); if(cd) calcDraft = cd;
  }catch(e){}
}
function saveLocal(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify({state, unsynced})); }catch(e){}
}

let writeChain = Promise.resolve();
const sleep = ms => new Promise(r=>setTimeout(r,ms));
function queueWrite(key, fn){
  const run = async ()=>{
    try{ await fn(); }
    catch(err){
      if(err && (err.code==='unavailable'||err.code==='resource_exhausted')){
        await sleep(800+Math.random()*800);
        try{ await fn(); return; }catch(e2){ err=e2; }
      }
      console.error(err);
      if(err && err.code==='quota_exceeded') toast('Storage is full — delete old records to add more.');
    }
  };
  writeChain = writeChain.then(run); return writeChain;
}
function persist(kind, id, deleted){
  saveLocal();
  if(IS_PHONE) return;
  if(dbRoot){
    const ref = dbRoot.collection(kind).doc(id);
    const obj = state[kind][id];
    queueWrite(kind+'/'+id, ()=> deleted ? ref.delete() : ref.set(JSON.parse(JSON.stringify(obj))));
  } else {
    unsynced = unsynced.filter(u=>!(u[0]===kind && u[1]===id));
    unsynced.push([kind,id,!!deleted]); saveLocal();
  }
}
function save(kind, obj){
  obj.updatedAt = Date.now();
  if(!obj.createdAt) obj.createdAt = Date.now();
  state[kind][obj.id] = obj;
  persist(kind, obj.id, false);
  render();
}
function remove(kind, id){
  delete state[kind][id];
  if(SYNC_KINDS.includes(kind)){ (tomb[kind] = tomb[kind]||{})[id] = Date.now(); saveTomb(); }
  persist(kind, id, true);
  render();
}
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

/* ---------- helpers ---------- */
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const dstr = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today = () => dstr(new Date());
const addDays = (s,n) => { const d = s?new Date(s+'T12:00'):new Date(); d.setDate(d.getDate()+n); return dstr(d); };
const daysBetween = (a,b) => Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/86400000);
function niceDate(s){
  if(!s) return 'No date';
  const diff = daysBetween(today(), s);
  if(diff===0) return 'Today'; if(diff===1) return 'Tomorrow'; if(diff===-1) return 'Yesterday';
  const d = new Date(s+'T12:00');
  const opts = {weekday:'short', day:'numeric', month:'short'};
  if(d.getFullYear()!==new Date().getFullYear()) opts.year='numeric';
  return d.toLocaleDateString('en-GB', opts);
}
function fmtTime(t){ if(!t) return ''; const [h,m]=t.split(':').map(Number); const ap=h>=12?'pm':'am'; return `${((h+11)%12)+1}${m?':'+pad(m):''}${ap}`; }
function aed(n, compact){
  n = Number(n)||0;
  if(compact && Math.abs(n)>=1000){
    const v = Math.abs(n)>=1e6 ? (n/1e6).toFixed(n>=1e7?1:2).replace(/\.?0+$/,'')+'M' : Math.round(n/1000)+'K';
    return 'AED '+v;
  }
  return 'AED '+Math.round(n).toLocaleString('en-US');
}
const initials = n => (n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const clientName = id => state.clients[id]?.name || '';
const commission = d => (Number(d.price)||0) * (Number(d.pct)||0)/100 * (d.share===''||d.share==null?100:Number(d.share))/100;
const openTasks = () => Object.values(state.tasks).filter(t=>!t.done);
const sortTasks = arr => arr.sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999') || (a.time||'99').localeCompare(b.time||'99'));

/* ---------- rendering ---------- */
const $main = document.getElementById('main');
function render(){
  renderNav();
  // don't redraw the calculator under someone's fingers while they type
  if((ui.tab==='calc'||ui.tab==='projects') && document.activeElement && document.activeElement.dataset && (document.activeElement.dataset.cin!==undefined || document.activeElement.dataset.pin!==undefined || document.activeElement.dataset.prj!==undefined)){ if(ui.sheetRefresh) ui.sheetRefresh(); return; }
  const scroll = $main.scrollTop;
  $main.innerHTML = ({today:viewToday, clients:viewClients, deals:viewDeals, money:viewMoney, calc:viewCalc, projects:IS_PHONE?viewToday:viewProjects, market:IS_PHONE?viewToday:viewMarket})[ui.tab]();
  $main.scrollTop = scroll;
  if(ui.sheetRefresh) ui.sheetRefresh();
}
function renderNav(){
  document.body.classList.toggle('on-calc', ui.tab==='calc' || ui.tab==='market');
  const tab = (id,label) => `<button class="tab ${ui.tab===id?'on':''}" data-act="tab" data-v="${id}" aria-current="${ui.tab===id?'page':'false'}">${I[id]}${id==='calc'?'<span class="lg">Calculators</span><span class="sm">Calcs</span>':label}</button>`;
  const navEl = document.getElementById('nav');
  navEl.innerHTML = tab('today','Today')+tab('clients','Clients')+`<button class="fab" data-act="quick" aria-label="Add new">${I.plus}<span class="fablbl">New</span></button>`+tab('deals','Deals')+tab('money','Earnings')+(IS_PHONE?'':tab('projects','Projects')+tab('market','Market'))+tab('calc','Calculators');
  navEl.style.setProperty('--tabs', IS_PHONE?5:7);
}

function taskRow(t, showDate){
  const late = t.date && t.date < today() && !t.done;
  const c = clientName(t.clientId);
  const when = showDate ? (late ? `${-daysBetween(today(),t.date)}d late` : niceDate(t.date)) : '';
  const time = fmtTime(t.time);
  return `<div class="row ${t.done?'done':''}">
    <button class="check ${t.done?'on':''}" data-act="toggle" data-id="${t.id}" aria-label="${t.done?'Mark not done':'Mark done'}">${I.check}</button>
    <div class="grow tap" data-act="task" data-id="${t.id}">
      <div class="t">${esc(t.title||t.type)}</div>
      <div class="s">${esc([t.type!==t.title?t.type:'', c].filter(Boolean).join(' with '))||'&nbsp;'}</div>
    </div>
    <div class="r ${late?'late':''} tap" data-act="task" data-id="${t.id}">${esc([when,time].filter(Boolean).join(', '))}</div>
  </div>`;
}

function viewToday(){
  const t0 = today();
  const open = sortTasks(openTasks());
  const overdue = open.filter(t=>t.date && t.date<t0);
  const todays = open.filter(t=>t.date===t0);
  const doneToday = Object.values(state.tasks).filter(t=>t.done && t.doneOn===t0);
  const week = open.filter(t=>t.date>t0 && t.date<=addDays(t0,7));
  const later = open.filter(t=>!t.date || t.date>addDays(t0,7));
  const pending = Object.values(state.deals).filter(d=>d.stage!=='received' && d.stage!=='lost').reduce((s,d)=>s+commission(d),0);

  const d = new Date();
  const hr = d.getHours();
  const greet = hr<12?'Good morning':hr<17?'Good afternoon':'Good evening';
  const calls = todays.filter(t=>['Call','Meeting','Viewing'].includes(t.type)).length;
  const bits = [];
  if(todays.length) bits.push(`<b>${todays.length} ${todays.length===1?'thing':'things'}</b> on today${calls?`, ${calls} of them calls or meetings`:''}`);
  else bits.push('Nothing booked for today yet');
  if(overdue.length) bits.push(`<b>${overdue.length} overdue</b>`);
  if(pending) bits.push(`<b>${aed(pending,true)}</b> commission in the pipeline`);

  const quiet = Object.values(state.clients).filter(c=>{
    if(!['Warm','Hot','Client','New'].includes(c.status)) return false;
    if(open.some(t=>t.clientId===c.id)) return false;
    const last = c.lastContact || (c.createdAt?dstr(new Date(c.createdAt)):t0);
    return daysBetween(last,t0) >= 14;
  }).sort((a,b)=>(a.lastContact||'').localeCompare(b.lastContact||'')).slice(0,6);

  let h = `<h1>${greet}.</h1><p class="lede">${d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}. ${bits.join(' · ')}.</p>`;
  const nRecords = KINDS.reduce((s,k)=>s+Object.keys(state[k]).length,0);
  const backupAge = lastBackup ? daysBetween(lastBackup, t0) : null;
  if(downloads && nRecords>=5 && (backupAge===null || backupAge>=7)){
    h += `<div class="backup-nudge"><div><b>${backupAge===null?'You haven\'t downloaded a backup yet':`Last backup ${backupAge} days ago`}</b><span>Keep a copy outside your account.</span></div><button class="btn small" data-act="exportXlsx">Download</button></div>`;
  }

  if(!Object.keys(state.clients).length && !Object.keys(state.tasks).length){
    h += `<div class="empty"><b style="color:var(--ink)">Start with your clients.</b><br>Add the people you're working with, then book calls, meetings and follow-ups against them. Already have them in Excel? Upload the file from the menu at the top right.
      <div class="actions"><button class="btn" data-act="newClient">Add a client</button><button class="btn ghost" data-act="settings">Import from Excel</button></div></div>`;
    return h;
  }
  h += `<div class="cols"><div class="col-main">`;
  if(overdue.length) h += `<h2 class="late">Overdue <small>${overdue.length}</small></h2><div class="list">${overdue.map(t=>taskRow(t,true)).join('')}</div>`;
  h += `<h2>Today <small>${todays.length} open${doneToday.length?`, ${doneToday.length} done`:''}</small></h2>`;
  h += (todays.length||doneToday.length) ? `<div class="list">${todays.map(t=>taskRow(t)).join('')}${doneToday.map(t=>taskRow(t)).join('')}</div>`
       : `<div class="empty">Clear so far. <br><button class="btn small ghost" data-act="newTask" data-date="${t0}">Add a call or meeting</button></div>`;
  if(week.length) h += `<h2>Next 7 days <small>${week.length}</small></h2><div class="list">${week.map(t=>taskRow(t,true)).join('')}</div>`;
  if(later.length){
    h += `<h2>Later <small>${later.length}</small></h2>`;
    h += ui.showLater ? `<div class="list">${later.map(t=>taskRow(t,true)).join('')}</div>` : `<button class="more" data-act="showLater">Show ${later.length} more</button>`;
  }
  h += `</div><aside class="col-side">`;
  const dealsAll = Object.values(state.deals);
  const awaitingD = dealsAll.filter(d=>d.stage==='closed'), progD = dealsAll.filter(d=>['negotiating','reserved','spa'].includes(d.stage));
  if(dealsAll.length){
    h += `<h2>Pipeline</h2><div class="list">
      <div class="row tap" data-act="tab" data-v="money"><div class="grow"><div class="t">Awaiting payment</div><div class="s">${awaitingD.length} deal${awaitingD.length===1?'':'s'}</div></div><div class="amt">${aed(awaitingD.reduce((x,d)=>x+commission(d),0),true)}</div></div>
      <div class="row tap" data-act="tab" data-v="deals"><div class="grow"><div class="t">In progress</div><div class="s">${progD.length} deal${progD.length===1?'':'s'}</div></div><div class="amt">${aed(progD.reduce((x,d)=>x+commission(d),0),true)}</div></div>
    </div>`;
  }
  if(quiet.length){
    h += `<h2>Going quiet <small>no contact in 14+ days</small></h2><div class="list">${quiet.map(c=>{
      const last = c.lastContact ? `${daysBetween(c.lastContact,t0)} days ago` : 'never logged';
      return `<div class="row"><div class="avatar">${esc(initials(c.name))}</div>
        <div class="grow tap" data-act="client" data-id="${c.id}"><div class="t">${esc(c.name)}</div><div class="s">Last contact ${last}</div></div>
        <button class="btn small ghost" data-act="newTask" data-client="${c.id}" data-type="Follow-up" data-date="${t0}">Follow up</button></div>`;
    }).join('')}</div>`;
  }
  h += `</aside></div>`;
  return h;
}

  const all = Object.values(state.clients);
  const counts = {all:all.length}; CLIENT_STATUS.forEach(s=>counts[s]=all.filter(c=>c.status===s).length);
  const q = ui.clientQuery.toLowerCase();
  const list = all.filter(c=>(ui.clientFilter==='all'||c.status===ui.clientFilter) &&
    (!q || [c.name,c.phone,c.email,c.interest,c.notes].join(' ').toLowerCase().includes(q)))
    .sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  const nextTask = id => sortTasks(openTasks().filter(t=>t.clientId===id))[0];
  let h = `<h1>Clients</h1>
    <input class="search" type="search" placeholder="Search name, phone, project…" value="${esc(ui.clientQuery)}" data-input="clientQuery" aria-label="Search clients">
    <div class="chips">${['all',...CLIENT_STATUS].map(s=>`<button class="chip ${ui.clientFilter===s?'on':''}" data-act="clientFilter" data-v="${s}">${s==='all'?'All':STATUS_LABEL[s]}<span>${counts[s]}</span></button>`).join('')}</div><div style="height:12px"></div>`;
  if(!all.length) return h+`<div class="empty">No clients yet. Add one, or upload your Excel file from the menu at the top.<div class="actions"><button class="btn" data-act="newClient">Add a client</button></div></div>`;
  if(!list.length) return h+`<div class="empty">No clients match that search.</div>`;

    const nt = nextTask(c.id);

    return `<div class="row tap" data-act="client" data-id="${c.id}"><div class="avatar">${esc(initials(c.name))}</div>

      <span class="pill ${c.status}">${STATUS_LABEL[c.status]||c.status}</span></div>`;

function dealCard(d){
  const idx = STAGE_IDX[d.stage] ?? -1;
  const next = d.stage!=='lost' && idx < STAGES.length-1 ? STAGES[idx+1] : null;
  const cls = d.stage==='received'?'stage-received':d.stage==='closed'?'stage-closed':d.stage==='lost'?'stage-lost':'';
  return `<div class="deal">
    <div class="top tap" data-act="deal" data-id="${d.id}"><div><div class="name">${esc(d.property||'Untitled deal')}</div><div class="who">${esc([clientName(d.clientId), d.type].filter(Boolean).join(' · '))}</div></div><span class="pill ${cls}">${esc(stageLabel(d.stage))}</span></div>
    <div class="nums tap" data-act="deal" data-id="${d.id}"><div>Price<b>${aed(d.price,true)}</b></div><div>Your commission<b class="comm">${aed(commission(d))}</b></div></div>
    ${d.stage!=='lost'?`<div class="stagebar" aria-hidden="true">${STAGES.map((s,i)=>`<i class="${i<=idx?'on':''}"></i>`).join('')}</div>`:''}
    ${next?`<div class="foot" style="margin-top:12px"><span class="who">${d.expected?`Expected ${niceDate(d.expected)}`:''}</span><button class="btn small ghost" data-act="advance" data-id="${d.id}">Move to ${esc(next.label.split(' –')[0])}</button></div>`:''}
  </div>`;
}
function viewDeals(){
  const all = Object.values(state.deals);
  const groups = {open:all.filter(d=>!['received','lost'].includes(d.stage)), received:all.filter(d=>d.stage==='received'), lost:all.filter(d=>d.stage==='lost'), all};
  const list = groups[ui.dealFilter].sort((a,b)=>(STAGE_IDX[b.stage]??-1)-(STAGE_IDX[a.stage]??-1) || (b.updatedAt||0)-(a.updatedAt||0));
  const labels = {open:'In progress',received:'Paid',lost:'Lost',all:'All'};
  const pipeline = groups.open.reduce((s,d)=>s+commission(d),0);
  let h = `<h1>Deals</h1><p class="lede">${groups.open.length} in progress worth <b>${aed(pipeline,true)}</b> to you.</p>
    <div class="chips">${Object.keys(labels).map(k=>`<button class="chip ${ui.dealFilter===k?'on':''}" data-act="dealFilter" data-v="${k}">${labels[k]}<span>${groups[k].length}</span></button>`).join('')}</div><div style="height:12px"></div>`;
  if(!all.length) return h+`<div class="empty">No deals yet. Log one as soon as a client makes an offer or pays an EOI, so the commission shows up in your pipeline.<div class="actions"><button class="btn" data-act="newDeal">Add a deal</button></div></div>`;
  if(!list.length) return h+`<div class="empty">Nothing here.</div>`;
  if(ui.dealFilter==='open'){
    STAGES.slice(0,4).slice().reverse().forEach(s=>{
      const g = list.filter(d=>d.stage===s.id); if(!g.length) return;
      h += `<h2>${esc(s.label)} <small>${g.length} · ${aed(g.reduce((x,d)=>x+commission(d),0),true)}</small></h2><div class="dgrid">${g.map(dealCard).join('')}</div>`;
    });
  } else h += `<div class="dgrid">${list.map(dealCard).join('')}</div>`;
  return h;
}

function viewMoney(){
  const all = Object.values(state.deals);
  const paidDate = d => d.paidDate || (d.updatedAt?dstr(new Date(d.updatedAt)):'');
  const received = all.filter(d=>d.stage==='received');
  const years = [...new Set(received.map(d=>paidDate(d).slice(0,4)).filter(Boolean).map(Number)), new Date().getFullYear()].sort((a,b)=>b-a);
  const inYear = received.filter(d=>ui.year==='all' || paidDate(d).startsWith(String(ui.year)));
  const earned = inYear.reduce((s,d)=>s+commission(d),0);
  const awaiting = all.filter(d=>d.stage==='closed');
  const progress = all.filter(d=>['negotiating','reserved','spa'].includes(d.stage));
  const aw = awaiting.reduce((s,d)=>s+commission(d),0), pr = progress.reduce((s,d)=>s+commission(d),0);
  const tot = earned+aw+pr || 1;
  const monthKey = dstr(new Date()).slice(0,7);
  const thisMonth = received.filter(d=>paidDate(d).startsWith(monthKey)).reduce((s,d)=>s+commission(d),0);

  let h = `<h1>Earnings</h1><div class="cols"><div class="col-side first">
  <div class="ledger">
    <div class="yearsel">${years.slice(0,3).map(y=>`<button class="${ui.year===y?'on':''}" data-act="year" data-v="${y}">${y}</button>`).join('')}<button class="${ui.year==='all'?'on':''}" data-act="year" data-v="all">All time</button></div>
    <div class="lbl">Commission received ${ui.year==='all'?'in total':'in '+ui.year}</div>
    <div class="big"><small>AED</small>${Math.round(earned).toLocaleString('en-US')}</div>
    <div class="split" aria-hidden="true"><i style="width:${earned/tot*100}%;background:var(--sea)"></i><i style="width:${aw/tot*100}%;background:var(--brass)"></i><i style="width:${pr/tot*100}%;background:rgba(255,255,255,.35)"></i></div>
    <div class="legend">
      <div><span class="dot" style="background:var(--sea)"></span>Received<b>${aed(earned,true)}</b></div>
      <div><span class="dot" style="background:var(--brass)"></span>Awaiting payment<b>${aed(aw,true)}</b></div>
      <div><span class="dot" style="background:rgba(255,255,255,.35)"></span>In progress<b>${aed(pr,true)}</b></div>
    </div>
  </div>
  <p class="lede" style="margin-top:12px">Total pending: <b>${aed(aw+pr)}</b>. Received this month: <b>${aed(thisMonth)}</b>.</p></div><div class="col-main">`;

  const row = (d, extra='') => `<div class="row"><div class="grow tap" data-act="deal" data-id="${d.id}"><div class="t">${esc(d.property||'Deal')}</div><div class="s">${esc([clientName(d.clientId), d.stage==='received'?'Paid '+niceDate(paidDate(d)):d.expected?'Expected '+niceDate(d.expected):stageLabel(d.stage)].filter(Boolean).join(' · '))}</div></div><div class="amt tap" data-act="deal" data-id="${d.id}">${aed(commission(d))}</div>${extra}</div>`;
  h += `<h2>Awaiting payment <small>${awaiting.length}</small></h2>`;
  h += awaiting.length ? `<div class="list">${awaiting.sort((a,b)=>(a.expected||'9').localeCompare(b.expected||'9')).map(d=>row(d,`<button class="btn small" data-act="markPaid" data-id="${d.id}">Paid</button>`)).join('')}</div>` : `<div class="empty">No closed deals waiting on commission. When a deal is done, move it to “Closed – awaiting commission” so you can chase the payment.</div>`;
  if(progress.length) h += `<h2>Still in progress <small>${progress.length}</small></h2><div class="list">${progress.map(d=>row(d)).join('')}</div>`;
  if(inYear.length) h += `<h2>Received <small>${inYear.length}</small></h2><div class="list">${inYear.sort((a,b)=>paidDate(b).localeCompare(paidDate(a))).map(d=>row(d)).join('')}</div>`;
  h += `</div></div><p class="syncnote">${syncMode==='db'?'Saved to your account — open this link on any device.':'Saved on this device only.'}</p>`;
  return h;
}

/* ---------- calculator: cash flow & yield (from the Excel model) ---------- */
const CALC_DEFAULTS = {fx:3.6725, price:510000, other:45000, loan:275000, term:144, rate:5, rent:40000, hoa:8500, maint:0};
const CALC_FIELDS = ['fx','price','other','loan','term','rate','rent','hoa','maint'];
let calcDraft = {id:null, name:'', clientId:'', cur:'AED', inputs:{...CALC_DEFAULTS}};
function saveDraft(){ try{ localStorage.setItem(LS_KEY+'-calc', JSON.stringify(calcDraft)); }catch(e){} }
function computeCalc(x){
  const n = k => Number(x[k])||0;
  const price=n('price'), other=n('other'), loan=n('loan'), term=n('term'), r=n('rate')/100/12;
  const dld = price*0.04;                                   // DLD fee 4%
  const total = price + dld + other;                         // total acquisition cost
  const pmt = term>0 ? (r ? loan*r/(1-Math.pow(1+r,-term)) : loan/term) : 0;  // =PMT(rate/12, months, -loan)
  const annualPay = pmt*12;
  const rent=n('rent'), hoa=n('hoa'), maint=n('maint');
  const net = rent - hoa - maint;                            // before financing
  const after = net - annualPay;
  const cash = total - loan;
  return {price, dld, other, total, loan, term, rate:n('rate'), pmt, annualPay, rent, hoa, maint, net,
    gross: total? rent/total : 0, netY: total? net/total : 0, after, monthly: after/12, cash, coc: cash? after/cash : 0, fx: n('fx')||3.6725};
}
const pct = v => (v*100).toFixed(2)+'%';
function money(v, cur, fx){ const x = cur==='USD' ? v/fx : v; const neg = x<0; return (neg?'(':'')+cur+' '+Math.round(Math.abs(x)).toLocaleString('en-US')+(neg?')':''); }
const fmtNum = v => (v===''||v==null) ? '' : Number(v).toLocaleString('en-US',{maximumFractionDigits:4});
const parseNum = v => { const t = String(v).replace(/[^\d.\-]/g,''); return t===''? '' : Number(t); };

function calcInput(key, label, sub, unit, after){
  const v = calcDraft.inputs[key];
  return `<div class="cin"><label for="ci-${key}">${label}${sub?`<small id="ci-sub-${key}">${sub}</small>`:''}</label>
    <div class="inp">${unit&&!after?`<span>${unit}</span>`:''}<input id="ci-${key}" data-cin="${key}" inputmode="decimal" autocomplete="off" value="${esc(fmtNum(v))}">${unit&&after?`<span>${unit}</span>`:''}</div></div>`;
}

    <div class="calc-card"><h4>Purchase</h4>
      ${calcInput('price','Purchase price','','AED')}
      <div class="cin"><label>DLD fee<small>4% of purchase price</small></label><span class="val" id="co-dld"></span></div>
      ${calcInput('other','Other costs','Agency fee, trustee, registration','AED')}
    </div>
    <div class="calc-card"><h4>Mortgage <small>set loan to 0 for a cash purchase</small></h4>
      ${calcInput('loan','Loan amount','<span id="co-ltv"></span>','AED')}
      ${calcInput('term','Loan term','<span id="co-years"></span>','months',true)}
      ${calcInput('rate','Interest rate','Annual','%',true)}
    </div>

const fmtMonth = ym => { if(!ym) return 'Date TBC'; const [y,m] = ym.split('-').map(Number); return new Date(y,m-1,1).toLocaleDateString('en-GB',{month:'short',year:'numeric'}); };

const pn = v => Number(v)||0;

function planCompute(p){
  const price = pn(p.prop.price), comp = p.prop.completion || '';
  let rows = [{kind:'down', key:'down', label:'Down payment', pct:pn(p.down.pct), date:p.down.date||''}];
  p.inst.forEach((it,i)=>rows.push({kind:'inst', key:it.id, label:(it.label||'').trim() || `Installment ${i+1}`, pct:pn(it.pct), date:it.date||''}));
  rows.push({kind:'comp', key:'comp', label:'On completion', pct:pn(p.comp.pct), date:comp});
  rows.forEach(r=>{ r.amount = price*r.pct/100; r.phase = r.kind==='comp' ? 'completion' : (comp && r.date && r.date > comp) ? 'post' : 'construction'; });
  const order = {down:0, inst:1, comp:2};
  rows.sort((a,b)=> (a.date||'9999-99').localeCompare(b.date||'9999-99') || (a.phase==='post')-(b.phase==='post') || order[a.kind]-order[b.kind]);
  const sum = ph => rows.filter(r=>r.phase===ph).reduce((s,r)=>s+r.amount,0);
  const sumP = ph => rows.filter(r=>r.phase===ph).reduce((s,r)=>s+r.pct,0);
  const reg = {pct:pn(p.reg.pct), amount: price*pn(p.reg.pct)/100, waived:!!p.reg.waived, date:p.reg.date || p.down.date || ''};
  const allocated = rows.reduce((s,r)=>s+r.pct,0);
  const ym = {};
  rows.forEach(r=>{ const y = r.date ? r.date.slice(0,4) : 'TBC'; ym[y] = (ym[y]||0) + r.amount; });
  const regYear = reg.date ? reg.date.slice(0,4) : 'TBC';
  const years = Object.keys(ym).concat(!reg.waived && reg.amount && !ym[regYear] ? [regYear] : []).filter((v,i,a)=>a.indexOf(v)===i).sort()
    .map(y=>({year:y, price: ym[y]||0, reg: (!reg.waived && y===regYear) ? reg.amount : 0}));
  return {price, rows, reg, allocated, cons:sum('construction'), consP:sumP('construction'), compA:sum('completion'), compP:sumP('completion'),
    post:sum('post'), postP:sumP('post'), years, payable: price + (reg.waived?0:reg.amount), size:pn(p.prop.size)};
}

let assetsCap = null;
const assetUrls = {};
const assetUrl = id => assetUrls[id] || ('/_blob/' + id);
const PDFJS_BASE = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@5.6.205/legacy/build/';
let pdfjsP = null;
function loadPdfJs(){
  if(!pdfjsP) pdfjsP = (async()=>{
    const lib = await import(PDFJS_BASE+'pdf.min.mjs');
    globalThis.pdfjsWorker = await import(PDFJS_BASE+'pdf.worker.min.mjs');
    lib.GlobalWorkerOptions.workerSrc = PDFJS_BASE+'pdf.worker.min.mjs';
    return lib;
  })().catch(e=>{ pdfjsP=null; throw e; });
  return pdfjsP;
}
async function renderPdfPage(doc, n, width){
  const pg = await doc.getPage(n); const v1 = pg.getViewport({scale:1});
  const vp = pg.getViewport({scale: width / v1.width});
  const cv = document.createElement('canvas'); cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
  const ctx = cv.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height);
  await pg.render({canvasContext:ctx, viewport:vp, canvas:cv}).promise;
  return cv;
}
const canvasToJpeg = (cv, q=0.86) => new Promise(res=>cv.toBlob(b=>res(b),'image/jpeg',q));
async function imageToJpeg(file, maxDim=2200){
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    const k = Math.min(1, maxDim/Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement('canvas'); cv.width = Math.round(img.naturalWidth*k); cv.height = Math.round(img.naturalHeight*k);
    const ctx = cv.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height); ctx.drawImage(img,0,0,cv.width,cv.height);
    return {blob: await canvasToJpeg(cv), w:cv.width, h:cv.height};
  } finally { URL.revokeObjectURL(url); }
}
async function uploadBlob(blob, type){
  if(!assetsCap) throw {code:'no_assets'};
  const r = await assetsCap.upload(blob, {type});
  assetUrls[r.id] = r.url;
  return r.id;
}
function uploadError(e){
  console.error(e);
  const c = e && e.code;
  toast(c==='no_assets' ? 'Uploads work when the app is opened from your claude.ai link.' :
        c==='too_large' || c==='payload_too_large' ? 'That file is over 20 MB. Choose fewer pages or a smaller file.' :
        c==='quota_or_state' ? 'Storage is full. Remove unused images or pages first.' : 'That upload didn\'t go through. Try again.');
}

async function handleProjectFiles(kind, files){
  const pr = state.projects[ui.projectId]; if(!pr || !files.length) return;
  try{
    if(kind==='images' || kind==='map'){
      let n = 0;
      for(const f of files){
        if(!/^image\//.test(f.type) && !/\.(jpe?g|png|webp|heic|gif)$/i.test(f.name)) continue;
        toast(`Uploading image ${++n} of ${files.length}…`);
        const j = await imageToJpeg(f, 2200); const id = await uploadBlob(j.blob, 'image/jpeg');
        if(kind==='map'){ pr.map = {id, w:j.w, h:j.h}; break; }
        pr.images = [...(pr.images||[]), {id, w:j.w, h:j.h}];
        saveProjectNow(pr); render();
      }
      saveProjectNow(pr); render(); toast(kind==='map'?'Map added.':'Images added.'); return;
    }
    if(kind==='floorplans'){
      for(const f of files){
        const base = f.name.replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ');
        if(/pdf$/i.test(f.type) || /\.pdf$/i.test(f.name)){
          toast('Reading PDF…');
          const lib = await loadPdfJs(); const doc = await lib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;
          const count = Math.min(doc.numPages, 20);
          for(let i=1;i<=count;i++){
            toast(`Adding floor plan ${i} of ${count}…`);
            const cv = await renderPdfPage(doc, i, 2000); const id = await uploadBlob(await canvasToJpeg(cv, 0.88), 'image/jpeg');
            pr.floorplans = [...(pr.floorplans||[]), {id, w:cv.width, h:cv.height, type:guessType(base), label: count>1?`${base} (${i})`:base}];
            saveProjectNow(pr); render();
          }
        } else {
          toast('Uploading floor plan…');
          const j = await imageToJpeg(f, 2400); const id = await uploadBlob(j.blob, 'image/jpeg');
          pr.floorplans = [...(pr.floorplans||[]), {id, w:j.w, h:j.h, type:guessType(base), label:base}];
          saveProjectNow(pr); render();
        }
      }
      toast('Floor plans added.'); return;
    }
    if(kind==='brochure') brochurePicker(files[0]);
  }catch(e){ if(e && e.code) uploadError(e); else { console.error(e); toast('That file couldn\'t be read. Try a different file.'); } }
}

async function brochureAdd(){

async function buildProjectPdf(pr, o){
  const PDFLib = await loadLib('https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js','PDFLib');
  const {PDFDocument, StandardFonts, rgb} = PDFLib;
  const fx = pn(calcDraft.inputs.fx)||3.6725;
  const pdf = await PDFDocument.create();
  const F = await pdf.embedFont(StandardFonts.Helvetica), B = await pdf.embedFont(StandardFonts.HelveticaBold);
  const hex = h => rgb(parseInt(h.slice(1,3),16)/255, parseInt(h.slice(3,5),16)/255, parseInt(h.slice(5,7),16)/255);
  const C = {ink:hex('#12302F'), ink2:hex('#1A3D3B'), ink3:hex('#214946'), sea:hex('#1F6F66'), seaSoft:hex('#DCEDE9'), brass:hex('#A87A22'), brassSoft:hex('#F4EAD5'),
    muted:hex('#5A6F6D'), line:hex('#D6DFDB'), soft:hex('#F1F5F3'), zebra:hex('#F7FAF9'), white:rgb(1,1,1), band:hex('#A9C2BE'), grey:hex('#8FA9A5'), pale:hex('#D9E6E3')};
  const clean = t => { t = String(t??''); try{ F.encodeText(t); return t; }catch(e){ return t.normalize('NFKD').replace(/[^\x20-\x7E]/g,''); } };
  const WB = (t,s)=>B.widthOfTextAtSize(clean(t),s), WF = (t,s)=>F.widthOfTextAtSize(clean(t),s);
  const M = 40, PW = 595.28, PH = 841.89, CW = PW-2*M;
  let page;
  const text = (t,x,y,size,opt={}) => { t=clean(t); const f=opt.bold?B:F; const w=f.widthOfTextAtSize(t,size); const xx = opt.align==='right'?x-w:opt.align==='center'?x-w/2:x; page.drawText(t,{x:xx,y,size,font:f,color:opt.color||C.ink}); return w; };
  const rect = (x,y,w,h,color,op) => page.drawRectangle({x,y,width:w,height:h,color,opacity:op});
  const hline = (x1,x2,y,th,color) => page.drawLine({start:{x:x1,y}, end:{x:x2,y}, thickness:th, color});
  const wrap = (t,size,maxW,font=F) => { const out=[]; String(clean(t)).split('\n').forEach(par=>{ if(!par.trim()){ out.push(''); return; } let line=''; par.split(/\s+/).forEach(w=>{ const tl=line?line+' '+w:w; if(font.widthOfTextAtSize(tl,size)>maxW && line){ out.push(line); line=w; } else line=tl; }); out.push(line); }); return out; };
  const curs = o.cur==='Both' ? ['AED','USD'] : [o.cur];
  const num = (v, cur) => Math.round(Math.abs(cur==='USD'? v/fx : v)).toLocaleString('en-US');
  const money = (v, i=0) => `${curs[i]} ${num(v,curs[i])}`;
  const title = pr.name || 'Project';
  const pages = [];

  // image helpers: crop to aspect (cover) or fit (contain)
  const imgCache = {};
  async function bitmap(id){ if(!imgCache[id]){ const b = await (await fetch(assetUrl(id))).blob(); imgCache[id] = await createImageBitmap(b); } return imgCache[id]; }
  async function coverImg(id, w, h){
    const bm = await bitmap(id); const ar = w/h; let sw = bm.width, sh = bm.width/ar; if(sh > bm.height){ sh = bm.height; sw = sh*ar; }
    const sx = (bm.width-sw)/2, sy = (bm.height-sh)/2, k = Math.min(1, 1800/sw);

  const now = new Date(), cy = now.getFullYear(), cm = now.getMonth()+1, cq = Math.floor(now.getMonth()/3)+1;
  if(p.kind==='month') return `${MONTHS[p.month-1]} ${p.year}${p.year===cy&&p.month===cm?' (month to date)':''}`;
  if(p.kind==='quarter') return `Q${p.quarter} ${p.year}${p.year===cy&&p.quarter===cq?' (quarter to date)':''}`;
  return `${p.year}${p.year===cy?' (year to date)':''}`;
}
const periodShort = p => p.kind==='month' ? `${MONTHS[p.month-1]} ${p.year}` : p.kind==='quarter' ? `Q${p.quarter} ${p.year}` : `${p.year}`;
const periodSame = p => p.kind==='month' ? `${MONTHS[p.month-1]} ${p.year-1}` : p.kind==='quarter' ? `Q${p.quarter} ${p.year-1}` : `${p.year-1}`;

function mcpMessage(e){
  const c = e && e.code;
  if(c==='server_not_connected' || c==='server_not_found') return 'Add DXBInteract in claude.ai Settings › Connectors to load market data.';
  if(c==='needs_reauth') return 'Reconnect DXBInteract in claude.ai Settings › Connectors, then try again.';
  if(c==='selection_required') return 'Choose which DXBInteract connection to use when claude.ai asks, then try again.';
  if(c==='not_in_manifest') return 'DXBInteract isn\'t allowed for this app yet. Allow it when claude.ai asks, then try again.';
  if(c==='blocked_by_policy' || c==='approval_required') return 'Your organisation\'s settings block this DXBInteract data.';
  if(c==='server_unavailable' || c==='rate_limited') return 'DXBInteract didn\'t respond. Try again in a moment.';
  if(c==='not_granted' || c==='capability_disabled' || c==='capability_removed') return 'Live market data works when the app is opened from your claude.ai link.';
  if(c==='tool_error') return `DXBInteract couldn't provide this data${e.message?': '+e.message:''}.`;
  return 'Market data couldn\'t be loaded. Try again.';
}
async function mktCall(tool, input){
  if(!mcpCap) throw {code:'not_granted'};
  const run = () => mcpCap.callTool(MKT_SERVER, tool, input, {cache:{staleTime:300000}});
  let r;
  try{ r = await run(); }
  catch(e){ if(e && e.retryable){ await sleep(Math.min(e.retryAfterMs||1200, 5000) + Math.random()*500); r = await run(); } else throw e; }
  let p = r && r.payload;
  if(p==null && r && r.content){ const t = r.content.find(b=>b.type==='text'); if(t){ try{ p = JSON.parse(t.text); }catch(_){} } }
  if(p==null) throw {code:'tool_error', message:'empty response'};
  return p;
}
async function loadMarket(force){
  const p = ui.mkt.period, key = periodKey(p);
  if(ui.mkt.data[key] && !force) return ui.mkt.data[key];
  ui.mkt.loading = true; ui.mkt.err = null; if(ui.tab==='market') render();
  const input = {year:p.year}; if(p.kind==='month') input.month = p.month; if(p.kind==='quarter') input.quarter = p.quarter;
  const jobs = {
    report: mktCall('get_period_market_report', input),
    cycle: mktCall('get_market_cycle', {}),
    rentCycle: mktCall('get_market_cycle', {type:'rent'}),
    cagr: mktCall('get_market_cagr', {years:5}),
    hot: mktCall('get_hot_areas', {period:'12M', limit:200}),
    supply: mktCall('get_supply_pipeline', {}),
  };
  const out = {errors:{}, fetchedAt:Date.now()};
  await Promise.all(Object.entries(jobs).map(([k,pr])=>pr.then(v=>{ out[k]=v; }).catch(e=>{ out.errors[k]=e; console.warn(k,e); })));
  ui.mkt.loading = false;
  if(!out.report){ ui.mkt.err = out.errors.report; if(ui.tab==='market') render(); return null; }
  ui.mkt.data[key] = out; if(ui.tab==='market') render();
  return out;
}

const sgn = v => v==null || isNaN(v) ? '' : (v>0?'+':'') + (Math.round(v*10)/10) + '%';
const lastRow = arr => (arr||[])[(arr||[]).length-1] || null;
function mktSummary(d){

async function loadCommunity(name){
  name = name.trim(); if(!name) return;

function projectFromProfile(p, row, base){
  const pr = base || newProject();
  pr.name = pr.name || p.name; pr.developer = p.dev || pr.developer; pr.location = p.area || pr.location;
  if(p.completion_date) pr.completion = p.completion_date.slice(0,7);
  pr.status = p.is_offplan==='Y' ? (p.progress>0 ? 'Under construction' : 'Off-plan') : 'Ready';
  const units = [];
  (p.stats||[]).filter(s=>s.bed!=='All').forEach(s=>{ const t = bedToType(s.bed); if(!t) return;
    const ls = (p.layouts||[]).filter(l=>bedToType(l.bed)===t && pn(l.price));
    const price = ls.length ? Math.min(...ls.map(l=>pn(l.price))) : pn(s.min_price);
    units.push({id:newId(), type:t, sizeFrom:pn(s.min_size)||'', sizeTo:pn(s.max_size)||'', price:price||''}); });
  if(!units.length) (p.layouts||[]).forEach(l=>{ const t = bedToType(l.bed); if(!t || units.find(u=>u.type===t)) return; const ls = p.layouts.filter(x=>bedToType(x.bed)===t); const sz = ls.map(x=>pn(x.size_sqft)).filter(Boolean);
    units.push({id:newId(), type:t, sizeFrom:sz.length?Math.min(...sz):'', sizeTo:sz.length?Math.max(...sz):'', price:Math.min(...ls.map(x=>pn(x.price)||Infinity))||''}); });
  if(units.length) pr.units = units;
  const first = (p.payment_plan||[])[0]?.title;
  const steps = (p.payment_plan||[]).filter(s=>s.title===first && s.type==='%');
  if(steps.length) pr.plan = steps.map(s=>({id:newId(), label:[s.step_title, s.milestone].filter(Boolean).join(' – '), pct:pn(s.payment)}));
  if((p.features||[]).length) pr.features = p.features.join('\n');
  pr.source = {provider:'DXBInteract', id:p.id, name:p.name, image:extUrl(p.main_image), brochure:extUrl(p.brochure_url), layouts:[...new Map((p.layouts||[]).filter(l=>extUrl(l.image)).map(l=>[l.image,{bed:l.bed, size:l.size_sqft, url:l.image}])).values()].slice(0,40), at:Date.now()};
  return pr;
}

  if(!mmDrag) return; const wasMoved = mmMoved; mmDrag = null;

  const wrap = (t,size,maxW,font=F) => { const out=[]; String(clean(t)).split('\n').forEach(par=>{ let line=''; par.split(/\s+/).forEach(w=>{ const tryL=line?line+' '+w:w; if(font.widthOfTextAtSize(tryL,size)>maxW && line){ out.push(line); line=w; } else line=tryL; }); out.push(line); }); return out; };

      if(a2-a1 < 0.002) return;
      const steps = Math.max(2, Math.ceil((a2-a1)/0.08)); let d = '';
      for(let i=0;i<=steps;i++){ const t=a1+(a2-a1)*i/steps; d += (i?'L':'M')+(R*Math.cos(t)).toFixed(2)+','+(R*Math.sin(t)).toFixed(2)+' '; }
      for(let i=steps;i>=0;i--){ const t=a1+(a2-a1)*i/steps; d += 'L'+(Rin*Math.cos(t)).toFixed(2)+','+(Rin*Math.sin(t)).toFixed(2)+' '; }
      page.drawSvgPath(d+'Z', {x:cx, y:cy, color:col});
    };
    page.drawCircle({x:cx, y:cy, size:R, color:C.white});
    parts.forEach(([,v,col])=>{ const a1 = a0 + 2*Math.PI*v/tot; arc(a0, a1, col); a0 = a1; });
    page.drawCircle({x:cx, y:cy, size:Rin, color:C.soft});
    text(r.rent? Math.round(parts[parts.length-1][1]/r.rent*100)+'%' : '0%', cx, cy-3, 13, {bold:true, align:'center', color:C.sea});
    text('kept', cx, cy-13, 7, {align:'center', color:C.muted});
    const lx = leftX+124; let ly2 = top-46;
    parts.forEach(([label,v,col])=>{
      rect(lx, ly2, 8, 8, col);
      text(label, lx+14, ly2+1, 8.6, {color:C.muted});
      text(r.rent? Math.round(v/r.rent*100)+'%' : '', leftX+pw-14, ly2+1, 9, {bold:true, align:'right'});
      ly2 -= 20;
    });
    // right panel: break-even
    const rx = rightX;
    rect(rx, py-PH_, pw, PH_, C.ink);
    text('Break-even rent', rx+14, py-20, 11, {bold:true, color:C.band});
    const s0 = `${curs[0]} ${num(beRent,curs[0])}`;
    text(s0, rx+14, top-50, 22, {bold:true, color:C.white});
    text('a year', rx+18+WB(s0,22), top-50, 9, {color:C.band});
    if(curs[1]) text(`${curs[1]} ${num(beRent,curs[1])}`, rx+14, top-64, 9, {color:C.band});
    // comparison bars
    const maxV = Math.max(r.rent, beRent) || 1, bw2 = pw-28-58;
    const bar = (label, v, col, yy) => {
      text(label, rx+14, yy+2, 8, {color:C.band});
      rect(rx+72, yy, bw2, 9, C.ink3);
      rect(rx+72, yy, Math.max(2, bw2*v/maxV), 9, col);
    };
    bar('Break-even', beRent, C.c1, top-94);
    bar('Your rent', r.rent, r.rent>=beRent?C.brass:C.neg, top-112);
    const diff = beRent ? (r.rent-beRent)/beRent : 0;
    const msg = !beRent ? 'No running costs entered' : diff>=0 ? `Rent is ${(diff*100).toFixed(1)}% above break-even` : `Rent is ${(-diff*100).toFixed(1)}% below break-even`;
    text(msg, rx+14, top-136, 9, {bold:true, color: diff>=0?hex('#E3C47E'):hex('#F2A08A')});
    y -= PH_ + 20;
  };
  const panelsH = 150 + 20;

  /* ---- note ---- */
  const drawNote = () => {
    rect(M, y-noteH+8, CW, noteH, C.soft); rect(M, y-noteH+8, 3, noteH, C.brass);
    if(noteInline){ text('Note', M+14, y-9, 8.6, {bold:true, color:C.brass}); text(noteLines[0], M+46, y-9, 9); }
    else { text('Note', M+14, y-8, 8.6, {bold:true, color:C.brass}); noteLines.forEach((l,i)=>text(l, M+14, y-22-i*12, 9)); }
    y -= noteH + 14;
  };

  // lay out what fits
  let room = y - FOOT - (noteH ? noteH+14 : 0);
  if(room >= panelsH){ PH_ = Math.min(200, room - 24); drawPanels(); }
  if(noteH) drawNote();

  /* ---- footer ---- */
  let fy = 84;
  const disc = `Estimates for illustration only, based on the figures above. Actual returns may vary. DLD fee at 4%.${curs.includes('USD')?` AED ${fx} = USD 1.`:''}`;
  wrap(disc, 7.4, CW).forEach((l,i)=>text(l, M, fy-i*9.5, 7.4, {color:C.muted}));
  rect(0, 0, PW, 54, C.ink); rect(0, 54, PW, 2, C.brass);
  const who = [o.agentName, o.company].filter(Boolean).join(', ');
  if(who || o.agentPhone){
    text('Prepared by', M, 34, 7.6, {color:C.band});
    text([who, o.agentPhone].filter(Boolean).join('   |   '), M, 20, 10, {bold:true, color:C.white});
  }
  text(dateStr, PW-M, 20, 8.5, {align:'right', color:C.band});

  pdf.setTitle(`${DOC_TITLE}${o.property?' – '+clean(o.property):''}`);
  pdf.setAuthor(clean([o.agentName,o.company].filter(Boolean).join(', ')));
  pdf.setCreator('Broker Desk');
  return await pdf.save();
}

/* ---------- two-way sync file ---------- */
async function syncOut(){
  const payload = {format:'broker-desk-sync', v:1, exportedAt:Date.now(), from: IS_PHONE?'phone':'desktop', data:{}, deleted:tomb};
  SYNC_KINDS.forEach(k=>payload.data[k] = state[k]);
  const d = new Date(), stamp = `${dstr(d)} ${pad(d.getHours())}.${pad(d.getMinutes())}`;
  try{
    await downloads.save({filename:`Broker Desk sync - ${IS_PHONE?'phone':'desktop'} - ${stamp}.json`, data:JSON.stringify(payload)});
    lastSync = Date.now(); saveTomb(); if(!IS_PHONE) saveMeta(); render(); toast('Sync file saved. Load it on your other device.');
  }catch(e){ if(e && e.code!=='declined') toast('The sync file couldn\'t be saved. Try again.'); }
}
async function syncIn(file){
  let inc;
  try{ inc = JSON.parse(await file.text()); }catch(e){ toast('That file isn\'t a sync file.'); return; }
  if(!inc || inc.format!=='broker-desk-sync'){ toast('That isn\'t a Broker Desk sync file. Use Restore for backups.'); return; }
  let added = 0, updated = 0, removed = 0;
  for(const k of SYNC_KINDS){
    const their = inc.data?.[k] || {}, theirDel = inc.deleted?.[k] || {};
    for(const rec of Object.values(their)){
      if(!rec || !rec.id) continue;
      const mine = state[k][rec.id], myDel = tomb[k]?.[rec.id];
      if(myDel && myDel >= (rec.updatedAt||0)) continue;                 // I deleted it after their last edit
      if(!mine){ state[k][rec.id] = rec; persist(k, rec.id, false); added++; }
      else if((rec.updatedAt||0) > (mine.updatedAt||0)){ state[k][rec.id] = rec; persist(k, rec.id, false); updated++; }
    }
    for(const [id, ts] of Object.entries(theirDel)){
      const mine = state[k][id];
      if(mine && ts >= (mine.updatedAt||0)){ delete state[k][id]; persist(k, id, true); removed++; }
      tomb[k] = tomb[k]||{}; if(!tomb[k][id] || tomb[k][id] < ts) tomb[k][id] = ts;
    }
  }

function readBackupRows(XLSX, wb){
  const get = name => { const sn = wb.SheetNames.find(n=>n.toLowerCase()===name); return sn ? XLSX.utils.sheet_to_json(wb.Sheets[sn], {defval:'', raw:false}) : []; };
  const map = (rows, cols) => rows.map(r=>{ const o={}; cols.forEach(([h,k])=>{ if(!k.startsWith('_')) o[k]=String(r[h]??'').trim(); }); return o; }).filter(o=>o.id);
  const clients = map(get('clients'), CLIENT_COLS).map(c=>({...c, status:statusFromLabel(c.status)}));
  const tasks = map(get('tasks'), TASK_COLS).map(t=>({...t, done:/^(yes|true|1)$/i.test(t.done), doneOn:t.doneOn||null}));
  const deals = map(get('deals'), DEAL_COLS).map(d=>({...d, stage:stageFromLabel(d.stage), price:Number(String(d.price).replace(/[^\d.]/g,''))||0, pct:Number(d.pct)||0, share:d.share===''?100:Number(d.share)}));
  const calcs = (get('calculations')).map(r=>{ const o={}; CALC_COLS.forEach(([h,k])=>{ const v=String(r[h]??'').trim(); if(k.startsWith('in.')) (o.inputs=o.inputs||{})[k.slice(3)] = Number(v.replace(/[^\d.\-]/g,''))||0; else if(!k.startsWith('_')&&!k.startsWith('out.')) o[k]=v; }); o.type='cashflow'; return o; }).filter(o=>o.id);
  get('payment plans').forEach(r=>{ const id=String(r['ID']||'').trim(); if(!id) return; try{ const plan = JSON.parse(r['Plan data (do not edit)']); calcs.push({id, type:'payplan', name:String(r['Name']||''), clientId:String(r['Client ID']||''), plan}); }catch(e){} });
  const projects = []; get('projects').forEach(r=>{ try{ const pr = JSON.parse(r['Project data (do not edit)']); if(pr && pr.id) projects.push(pr); }catch(e){} });
  const maps = []; get('maps').forEach(r=>{ try{ const m = JSON.parse(r['Map data (do not edit)']); if(m && m.id) maps.push(m); }catch(e){} });
  return {clients, tasks, deals, calcs, projects, maps};
}
async function restoreData(data, label){
  const counts = KINDS.map(k=>(data[k]||[]).length);
  if(!counts.some(Boolean)){ toast('That backup has nothing to restore.'); return; }
  if(!confirm(`Restore ${counts[0]} clients, ${counts[1]} tasks, ${counts[2]} deals and ${counts[3]} calculations from ${label}?\n\nRecords in the backup replace the current versions. Anything added since stays.`)) return;
  for(const k of KINDS) for(const rec of (data[k]||[])){
    if(!rec || !rec.id) continue;
    const clean = Object.fromEntries(Object.entries(rec).filter(([,v])=>v!==undefined));
    state[k][rec.id] = {...clean, updatedAt:Date.now(), createdAt:clean.createdAt||Date.now()};
    persist(k, rec.id, false);
  }
  render(); closeSheet(); toast('Backup restored.');
}
async function restoreFromFile(file){
  try{
    if(/\.json$/i.test(file.name)){
      const j = JSON.parse(await file.text()); const src = j.state || j;
      restoreData(Object.fromEntries(KINDS.map(k=>[k, Object.values(src[k]||{})])), file.name); return;
    }
    toast('Reading your backup…');
    const XLSX = await loadXLSX();
    const wb = XLSX.read(await file.arrayBuffer(), {type:'array'});
    const data = readBackupRows(XLSX, wb);
    if(!KINDS.some(k=>data[k].length)){ toast('That file isn\'t a Broker Desk backup. To add clients from a regular spreadsheet, use Import.'); return; }
    restoreData(data, file.name);
  }catch(e){ console.error(e); toast('That backup file couldn\'t be read.'); }
}

/* daily restore points, kept in the account */
const SNAP_CHUNK = 150000;
async function writeRestorePoint(){
  if(!dbRoot) return;
  const date = today(); const col = dbRoot.collection('snapshots');
  try{
    if((await col.doc(date).get()).exists) return;
    if(!KINDS.some(k=>Object.keys(state[k]).length)) return;
    const chunks = []; let cur = {clients:[],tasks:[],deals:[],calcs:[],projects:[],maps:[]}, size = 0;
    for(const k of KINDS) for(const rec of Object.values(state[k])){
      const len = JSON.stringify(rec).length;
      if(size+len > SNAP_CHUNK && size){ chunks.push(cur); cur={clients:[],tasks:[],deals:[],calcs:[],projects:[],maps:[]}; size=0; }
      cur[k].push(rec); size += len;
    }
    chunks.push(cur);
    for(let i=0;i<chunks.length;i++) await col.doc(`${date}_part${i}`).set({date, part:i, ...JSON.parse(JSON.stringify(chunks[i]))});
    const counts = Object.fromEntries(KINDS.map(k=>[k,Object.keys(state[k]).length]));
    await col.doc(date).set({date, parts:chunks.length, counts, index:true});
    // keep the 7 most recent
    const all = await col.where('index','==',true).get();
    const dates = all.docs.map(d=>d.data().date).sort().reverse();
    for(const old of dates.slice(7)){
      const meta = all.docs.find(d=>d.data().date===old).data();
      for(let i=0;i<(meta.parts||0);i++) await col.doc(`${old}_part${i}`).delete();
      await col.doc(old).delete();
    }
  }catch(e){ console.error('restore point', e); }
}
async function listRestorePoints(){
  if(!dbRoot) return [];
  try{
    const all = await dbRoot.collection('snapshots').where('index','==',true).get();
    return all.docs.map(d=>d.data()).sort((a,b)=>b.date.localeCompare(a.date));
  }catch(e){ console.error(e); return []; }

async function restorePoint(date){
  try{
    const col = dbRoot.collection('snapshots'); const meta = (await col.doc(date).get()).data();
    if(!meta){ toast('That restore point is no longer available.'); return; }
    const data = {clients:[],tasks:[],deals:[],calcs:[],projects:[],maps:[]};

    restoreData(data, `the restore point from ${niceDate(date)}`);
  }catch(e){ console.error(e); toast('Couldn\'t load that restore point.'); }
}

/* ---------- CSV ---------- */
function parseCSV(text){
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=ch; }
    else if(ch==='"') q=true;
    else if(ch===','||ch===';'&&!text.slice(0,200).includes(',')) { row.push(cur); cur=''; }
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(cur); rows.push(row); row=[]; cur=''; }
    else cur+=ch;
  }
  if(cur||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(c=>c.trim()));
}
const NAME_KEYS = ['name','client'];
function headerIndex(rows){
  // Excel sheets often have a title or blank rows above the real header
  for(let i=0;i<Math.min(rows.length,15);i++){
    if(rows[i].some(c=>NAME_KEYS.some(k=>String(c).trim().toLowerCase().includes(k)))) return i;
  }
  return -1;
}
const libLoads = {};
function loadLib(url, name){
  if(window[name]) return Promise.resolve(window[name]);
  if(!libLoads[url]) libLoads[url] = new Promise((res,rej)=>{
    const sc = document.createElement('script'); sc.src = url;
    sc.onload = ()=> window[name] ? res(window[name]) : rej(new Error('load'));
    sc.onerror = ()=>{ delete libLoads[url]; rej(new Error('load')); };
    document.head.appendChild(sc);
  });
  return libLoads[url];
}
let xlsxLoading = null;
function loadXLSX(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(!xlsxLoading) xlsxLoading = new Promise((res,rej)=>{
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload = ()=>res(window.XLSX); sc.onerror = ()=>{ xlsxLoading=null; rej(new Error('load')); };
    document.head.appendChild(sc);
  });
  return xlsxLoading;
}
async function importFile(file){
  const isCSV = /\.csv$/i.test(file.name) || file.type==='text/csv';
  if(isCSV){ importRows(parseCSV((await file.text()).replace(/^\uFEFF/,''))); return; }
  toast('Reading your spreadsheet…');
  let XLSX;
  try{ XLSX = await loadXLSX(); }catch(e){ toast('Couldn\'t load the Excel reader. Check your connection and try again.'); return; }
  let wb;
  try{ wb = XLSX.read(await file.arrayBuffer(), {type:'array', cellDates:true}); }
  catch(e){ toast('That file couldn\'t be opened as a spreadsheet.'); return; }
  // use the first sheet that has a Name column
  for(const sn of wb.SheetNames){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, raw:false, defval:''}).map(r=>r.map(c=>String(c??'')));
    if(headerIndex(rows)>=0){ importRows(rows, sn, wb.SheetNames.length>1); return; }
  }
  toast('Couldn\'t find a Name column in any sheet.');
}
async function importRows(rows, sheetName, multi){
  rows = rows.filter(r=>r.some(c=>String(c).trim()));
  const hi = headerIndex(rows);
  if(hi<0){ toast('Couldn\'t find a Name column.'); return; }
  rows = rows.slice(hi);
  if(rows.length<2){ toast('That file has no rows to import.'); return; }
  const head = rows[0].map(h=>String(h).trim().toLowerCase());
  const find = (...keys) => head.findIndex(h=>keys.some(k=>h.includes(k)));
  const col = {name:find('name','client'), phone:find('phone','mobile','whatsapp','contact no','number'), email:find('email','e-mail'),
    status:find('status','stage'), budget:find('budget'), source:find('source','lead from'), interest:find('interest','looking','project','requirement','area'), notes:find('note','comment','remark')};
  if(col.name<0){ toast('Couldn\'t find a Name column.'); return; }
  const existing = new Set(Object.values(state.clients).map(c=>(c.name+'|'+(c.phone||'')).toLowerCase()));
  let n=0;
  for(const r of rows.slice(1)){
    const g = k => col[k]>=0 ? (r[col[k]]||'').trim() : '';
    const name = g('name'); if(!name) continue;
    if(existing.has((name+'|'+g('phone')).toLowerCase())) continue;
    let st = g('status').toLowerCase();
    const status = /hot/.test(st)?'Hot':/warm|interest/.test(st)?'Warm':/client|closed|bought|investor/.test(st)?'Client':/cold|dead|lost/.test(st)?'Cold':'New';
    const c = {id:newId(), name, phone:g('phone'), email:g('email'), status, budget:g('budget'), source:g('source'), interest:g('interest'), notes:g('notes'), createdAt:Date.now(), updatedAt:Date.now()};
    state.clients[c.id]=c; persist('clients', c.id, false); n++;
  }
  render(); closeSheet(); toast(`Imported ${n} client${n===1?'':'s'}${multi&&sheetName?` from “${sheetName}”`:''}.`);
}
function toCSV(rows){ return rows.map(r=>r.map(v=>{v=String(v??''); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(',')).join('\n'); }

/* ---------- toast ---------- */
let toastTimer;
function toast(msg, actLabel, fn){
  const el = document.getElementById('toast');
  el.innerHTML = `<span>${esc(msg)}</span>${actLabel?`<button id="toastAct">${esc(actLabel)}</button>`:''}`;
  el.classList.add('on');
  if(actLabel) document.getElementById('toastAct').onclick = ()=>{ el.classList.remove('on'); fn(); };
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>el.classList.remove('on'), actLabel?6000:2800);
}

document.addEventListener('submit', e=>{

  if(kind==='task'){

    const {followup, ...rest} = v;

    if(!base){ closeSheet(); return; }
    const pin = {id:base.id, x:base.x, y:base.y, kind:v.kind, color:v.color||PIN_COLS[0]};
    if(v.kind==='project'){ if(!v.project){ toast('Choose a project, or pick a note instead.'); return; } pin.ref = v.project; }
    else if(v.kind==='area'){ if(!(v.area||'').trim()){ toast('Enter the area name.'); return; } pin.ref = v.area.trim(); pin.label = v.area.trim(); }
    else { pin.label = (v.label||'').trim() || 'Note'; }

    const n = Math.min(240, Math.max(1, parseInt(v.count)||0)), every = parseInt(v.every)||1, pc = parseNum(v.pct)||0;
    const base = planDraft.inst.length;

  } else if(kind==='plansave'){
    const asNew = f.dataset.new==='1';

    .forEach(([tag, attrs])=>{ const el = document.createElement(tag); Object.entries(attrs).forEach(([k,v])=>el.setAttribute(k,v)); head.appendChild(el); });

(async function connect(){
  if(!window.claude || typeof window.claude.use!=='function') return;
  try{
    const [db, user, dl, as, mc] = await Promise.all([claude.use('db'), claude.use('user'), claude.use('downloads'), claude.use('assets'), claude.use('mcp')]);
    downloads = dl; assetsCap = as; mcpCap = mc; render();
    const uid = user ? await user.id() : null;
    if(!db || !uid){ render(); return; }
    dbRoot = db.doc(`data/users/${uid}/desk`);
    // push anything saved on this device before the account store was reachable
    const pending = unsynced.slice();
    for(const [kind,id,deleted] of pending){
      const ref = dbRoot.collection(kind).doc(id);
      try{ if(deleted) await ref.delete(); else if(state[kind][id]) await ref.set(JSON.parse(JSON.stringify(state[kind][id]))); }catch(err){ console.error(err); }
    }
    unsynced = []; syncMode='db'; saveLocal();
    try{ const meta = (await dbRoot.get()).data(); if(meta && meta.lastBackup) lastBackup = meta.lastBackup; if(meta && meta.docProfile) docProfile = {...docProfile, ...meta.docProfile}; if(meta && meta.tomb){ SYNC_KINDS.forEach(k=>{ tomb[k] = {...(meta.tomb[k]||{}), ...(tomb[k]||{})}; }); } if(meta && meta.lastSync && (!lastSync || meta.lastSync > lastSync)) lastSync = meta.lastSync; }catch(e){}
    const ready = new Set(); let pointDone = false;
    KINDS.forEach(kind=>{
      dbRoot.collection(kind).onSnapshot(snap=>{
        const m = {}; snap.docs.forEach(d=>{ const x=d.data(); if(x) m[d.id] = {...x, id:d.id}; });
        state[kind] = m; saveLocal(); render();
        if(!snap.metadata.fromCache) ready.add(kind);
        if(!pointDone && ready.size===KINDS.length){ pointDone = true; setTimeout(writeRestorePoint, 4000); }
      }, err=>{ console.error(err); if(err.code==='revoked'){ dbRoot=null; syncMode='local'; render(); } });
    });
    render();
  }catch(err){ console.error(err); }
})();
